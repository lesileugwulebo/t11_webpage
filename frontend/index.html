<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verdad Solution InventoryApp</title>
  <meta name="description" content="Verdad Solution InventoryApp - A powerful, modern inventory management system built with React and MySQL." />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core CSS -->
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />

  <!-- React 18 & ReactDOM via CDN (production/development builds) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone for JSX transformation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Microsoft Entra ID (MSAL.js) for Single Sign-On -->
  <script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Application Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/entraAuth.js"></script>
  
  <script type="text/babel" src="/js/components/Toast.js"></script>
  <script type="text/babel" src="/js/authContext.js"></script>
  <script type="text/babel" src="/js/components/Navbar.js"></script>
  <script type="text/babel" src="/js/components/StatsCard.js"></script>
  <script type="text/babel" src="/js/components/Modals.js"></script>
  <script type="text/babel" src="/js/components/ActivityFeed.js"></script>
  <script type="text/babel" src="/js/components/InventoryTable.js"></script>
  
  <script type="text/babel" src="/js/pages/UserLogin.js"></script>
  <script type="text/babel" src="/js/pages/AdminLogin.js"></script>
  <script type="text/babel" src="/js/pages/AdminDashboard.js"></script>
  <script type="text/babel" src="/js/pages/UserDashboard.js"></script>
  
  <script type="text/babel" src="/js/app.js"></script>
</body>
</html>
